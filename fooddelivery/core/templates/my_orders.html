<!DOCTYPE html>
<html>
<head>
    <title>My Orders</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background-color: #f8f9fa; }
        .order-card { background: white; border: 1px solid #ddd; padding: 15px; margin-bottom: 10px; border-radius: 6px; }
    </style>
</head>
<body>
    <a href="{% url 'home' %}">← Back to Menu</a>
    <h2>📦 My Orders</h2>
    {% for order in orders %}
        <div class="order-card">
            <h4>Order #{{ order.id }} - Total: ₹{{ order.total_amount }}</h4>
            <ul>
                {% for item in order.items.all %}
                    <li>{{ item.name }} - ₹{{ item.price }}</li>
                {% endfor %}
            </ul>
        </div>
    {% empty %}
        <p>Aapne abhi tak koi order nahi kiya hai.</p>
    {% endfor %}
</body>
</html>
